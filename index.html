<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:description" content="Minhas ferramentas e materiais de IA em um só lugar.">

<style>
/* ==========================================================
   1. CORES — mude aqui para ajustar a paleta inteira
   ========================================================== */
:root{
  --fundo:#07071a;
  --roxo:#7c3aed;
  --azul:#2563eb;
  --violeta:#a855f7;

  --superficie:rgba(255,255,255,.055);
  --superficie-borda:rgba(168,140,255,.17);
  --tinta:#f0edff;
  --tinta-fraca:#9d98c7;
  --linha:rgba(168,140,255,.16);

  --raio:18px;
  --col:440px;
  --fonte-titulo:"Bricolage Grotesque", system-ui, sans-serif;
  --fonte-texto:"Inter Tight", system-ui, sans-serif;
}

/* ==========================================================
   2. BASE
   ========================================================== */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--fundo)}
body{
  font-family:var(--fonte-texto);
  color:var(--tinta);
  background:
    radial-gradient(100% 55% at 18% -5%,  rgba(124,58,237,.55) 0%, transparent 62%),
    radial-gradient(90%  45% at 92% 8%,   rgba(37,99,235,.45)  0%, transparent 60%),
    radial-gradient(120% 60% at 50% 108%, rgba(88,28,190,.35)  0%, transparent 65%),
    var(--fundo);
  background-attachment:fixed;
  min-height:100dvh;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:22px 20px 70px;
  display:flex;
  justify-content:center;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

.pagina{width:100%;max-width:var(--col)}

a:focus-visible{
  outline:2.5px solid var(--violeta);
  outline-offset:3px;
  border-radius:10px;
}

/* ==========================================================
   3. TOPO — foto, nome, bio
   ========================================================== */
.topo{text-align:center;margin-bottom:4px}

/* --- capa 3D --- */
.capa{
  perspective:900px;
  margin:-14px 0 0;
}
.capa-inner{
  position:relative;
  height:190px;
  border-radius:22px;
  overflow:hidden;
  transform:rotateX(9deg) scale(.97);
  transform-origin:50% 100%;
  box-shadow:0 30px 60px -30px rgba(37,99,235,.8), 0 0 0 1px rgba(168,140,255,.14) inset;
  animation:inclina 14s ease-in-out infinite;
  /* a capa se dissolve no fundo da página */
  -webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 42%, rgba(0,0,0,.55) 72%, transparent 100%);
          mask-image:linear-gradient(to bottom, #000 0%, #000 42%, rgba(0,0,0,.55) 72%, transparent 100%);
}
.capa-inner img{
  width:100%;height:100%;
  object-fit:cover;
  object-position:50% 42%;
  animation:aproxima 22s ease-in-out infinite alternate;
}
/* véu roxo/azul por cima, para casar com a paleta */
.capa-inner::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom, rgba(124,58,237,.18), rgba(7,7,26,.15) 45%, rgba(7,7,26,.85));
}

@keyframes inclina{
  0%,100%{transform:rotateX(9deg) rotateZ(0deg) scale(.97)}
  50%    {transform:rotateX(5deg) rotateZ(-.5deg) scale(1)}
}
@keyframes aproxima{
  from{transform:scale(1.04)}
  to  {transform:scale(1.14)}
}
@keyframes flutua{
  0%,100%{transform:translateY(0)}
  50%    {transform:translateY(-8px)}
}

.moldura{
  position:relative;z-index:2;
  width:116px;height:116px;
  margin:-66px auto 18px;
  animation:flutua 6s ease-in-out infinite;
  padding:3px;
  border-radius:50%;
  background:linear-gradient(145deg, var(--violeta), var(--azul) 70%);
  box-shadow:0 0 32px -6px rgba(124,58,237,.75), 0 22px 34px -18px #000;
}
.foto{
  width:100%;height:100%;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--fundo);
}

.nome{
  font-family:var(--fonte-titulo);
  font-weight:800;
  font-size:clamp(30px,8.5vw,38px);
  letter-spacing:-0.035em;
  line-height:1.05;
}

.bio{
  margin:13px auto 0;
  max-width:34ch;
  font-size:15.5px;
  color:var(--tinta-fraca);
  text-wrap:balance;
}

/* ==========================================================
   4. TÍTULO DE SEÇÃO
   ========================================================== */
.secao{
  display:flex;align-items:center;gap:12px;
  margin:34px 2px 14px;
  font-size:13px;font-weight:600;
  color:var(--tinta-fraca);
}
.secao::after{content:"";flex:1;height:1px;background:var(--linha)}

/* ==========================================================
   5. LINKS
   ========================================================== */
.links{display:flex;flex-direction:column;gap:12px}

/* o ângulo que gira em volta do botão */
@property --angulo{syntax:"<angle>";initial-value:0deg;inherits:false}

.link{
  position:relative;
  overflow:hidden;
  display:flex;align-items:center;gap:13px;
  background:var(--superficie);
  border:1px solid var(--superficie-borda);
  border-radius:var(--raio);
  padding:12px 15px 12px 12px;
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  box-shadow:0 12px 30px -20px #000;
  transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  animation:respira 7s ease-in-out infinite;
}

/* luz que dá a volta na borda, bem devagar */
.link::before{
  content:"";
  position:absolute;inset:0;
  border-radius:inherit;
  padding:1.5px;
  background:conic-gradient(from var(--angulo),
    transparent 0deg, transparent 190deg,
    var(--azul) 250deg, var(--violeta) 300deg,
    rgba(255,255,255,.9) 330deg, transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
          mask-composite:exclude;
  animation:girar 9s linear infinite;
  pointer-events:none;
}

/* brilho que atravessa o botão de vez em quando */
.link::after{
  content:"";
  position:absolute;top:0;left:0;
  width:45%;height:100%;
  background:linear-gradient(100deg, transparent, rgba(168,140,255,.16), transparent);
  transform:translateX(-160%);
  animation:varrer 7s ease-in-out infinite;
  pointer-events:none;
}

/* cada botão começa em um tempo diferente */
.link:nth-child(2){animation-delay:-3.5s}
.link:nth-child(2)::before{animation-delay:-4.5s}
.link:nth-child(2)::after{animation-delay:3.5s}

@keyframes girar{to{--angulo:360deg}}
@keyframes varrer{
  0%,55%{transform:translateX(-160%)}
  85%,100%{transform:translateX(380%)}
}
@keyframes respira{
  0%,100%{box-shadow:0 12px 30px -20px #000, 0 0 0 0 rgba(124,58,237,0)}
  50%    {box-shadow:0 12px 30px -20px #000, 0 0 26px -6px rgba(124,58,237,.45)}
}
.link:active{transform:scale(.985)}
@media (hover:hover){
  .link:hover{
    transform:translateY(-2px);
    border-color:rgba(168,140,255,.45);
    box-shadow:0 14px 34px -18px rgba(124,58,237,.9);
  }
}

/* miniatura do botão */
.mini, .texto, .seta{position:relative;z-index:1}

.mini{
  width:48px;height:48px;flex:none;
  border-radius:12px;
  object-fit:cover;
  background:rgba(255,255,255,.06);
}

.texto{flex:1;min-width:0}
.titulo{
  font-weight:600;font-size:15.5px;
  letter-spacing:-0.012em;
  line-height:1.3;
}
.sub{
  font-size:13px;color:var(--tinta-fraca);
  margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.seta{
  flex:none;width:18px;height:18px;
  stroke:var(--tinta-fraca);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
}

/* ==========================================================
   6. ENTRADA (uma animação só, ao carregar)
   ========================================================== */
.anima{opacity:0;transform:translateY(10px);animation:sobe .55s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes sobe{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .anima{animation:none;opacity:1;transform:none}
  .link, .link::before, .link::after{animation:none !important}
  .capa-inner, .capa-inner img, .moldura{animation:none !important}
  .link::after{opacity:0}
  *{transition:none !important}
}
</style>
</head>
